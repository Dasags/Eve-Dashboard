services:
  db:
    image: postgres:16-alpine
    container_name: eve-world-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eveworld
      POSTGRES_USER: eveworld
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bitte-aendern}"
    volumes:
      - eve-dashboard-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eveworld -d eveworld"]
      interval: 5s
      timeout: 5s
      retries: 10

  eve-world:
    image: eve-dashboard:latest
    build: .
    container_name: eve-world
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - eve-dashboard-data:/data
    environment:
      APP_NAME: "EVE-World"
      # Muss zu POSTGRES_PASSWORD oben passen. Ohne DATABASE_URL wird weiter SQLite in /data genutzt.
      DATABASE_URL: "postgresql://eveworld:${POSTGRES_PASSWORD:-bitte-aendern}@db:5432/eveworld"
      CONTACT: "dein-name@example.com"        # User-Agent für zKillboard/ESI
      COOKIE_SECURE: "true"                    # false, wenn ohne HTTPS getestet wird
      PUBLIC_URL: "https://www.adresse.net"    # öffentliche Adresse (nötig für Authentik)

      # --- EVE-Login (EVE SSO) – App unter https://developers.eveonline.com/applications anlegen ---
      # Callback-URL dort: https://www.adresse.net/auth/callback
      # Scopes dort: esi-skills.read_skills.v1, esi-skills.read_skillqueue.v1, esi-wallet.read_character_wallet.v1, esi-assets.read_assets.v1,
      #   esi-markets.structure_markets.v1, esi-universe.read_structures.v1
      EVE_CLIENT_ID: ""
      EVE_CLIENT_SECRET: ""
      SESSION_SECRET: "${SESSION_SECRET:-}"

      # --- Admin-Login Variante 1: reines Passwort (/admin) ---
      ADMIN_PASSWORD: "bitte-aendern"

      # --- Admin-Login Variante 2: Authentik (OAuth2/OIDC), optional, auch zusätzlich zum Passwort ---
      # Redirect-URI in Authentik: https://www.adresse.net/admin/oidc/callback
      # OIDC_ISSUER: "https://authentik.example.com/application/o/eve-world/"
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_ADMIN_GROUP: "eve-admins"          # optional: nur diese Authentik-Gruppe darf rein

volumes:
  eve-dashboard-data:
  eve-dashboard-pg:
